[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid

[program:agent-server]
command=python3 /workspace/bin/agent-server.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay]
command=python3 /workspace/bin/relay.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
; Runs the standalone server traced by `next build` (next.config.ts sets
; output: "standalone"). `next start` doesn't work with that setting — it
; ignores the trimmed standalone bundle and warns on every start. To rebuild
; after code changes:
; 1. docker exec <container> bash -c "cd /workspace/dashboard && npm run build"
; 2. Then restart: docker restart <container>
command=bash -c "PORT=${DASHBOARD_PORT:-3000} node .next/standalone/server.js"
directory=/workspace/dashboard
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=python3 /workspace/bin/scheduler.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# recovery-agent (2026-08-08) — deterministic ops watchdog, see
# bin/recovery-agent.py docstring and
# agents/Marvin/inbox/recovery-agent-spec-2026-08-08.md. Ships in
# RECOVERY_DRY_RUN=true (default) until its two playbooks have run clean
# for a while — see the spec's rollout section before flipping it live.
[program:recovery-agent]
command=python3 /workspace/bin/recovery-agent.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
